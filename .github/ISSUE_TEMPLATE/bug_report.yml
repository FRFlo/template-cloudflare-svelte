name: Signaler un bogue
description: Signaler un problème reproductible.
title: "[Bogue] : "
body:
  - type: markdown
    attributes:
      value: |
        Merci de décrire le problème avec assez de détails pour le reproduire.
  - type: textarea
    id: description
    attributes:
      label: Description du problème
      description: Que se passe-t-il ?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Étapes pour reproduire
      description: Décrivez les étapes et les commandes nécessaires.
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportement attendu
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environnement
      description: Système, navigateur ou environnement Cloudflare concerné.
    validations:
      required: false
